# Dependabot が作成した PR を Claude がレビューし、結果をPRにコメントする。
# 自動マージは行わない。マージ判断は人間が行う。
#
# 前提: Dependabot secret に CLAUDE_CODE_OAUTH_TOKEN の登録が必要。
#   Settings → Secrets and variables → Dependabot → New repository secret
#   Dependabot 起因のワークフローは Actions secrets を参照できないため、
#   既に Actions secret として登録済みでも別途登録が要る。
#
# トリガーに synchronize を含めないのは、`@dependabot rebase` や base 更新時の
# 自動 rebase で同じレビューが繰り返し走るのを避けるため。
# 代償として、未マージPRが新バージョンに force-push された場合は自動レビューされない。
# 必要なら Actions 画面の Re-run jobs で再実行する（再実行時も github.actor は dependabot[bot] のまま）。
name: Dependabot Review

on:
  pull_request:
    branches: [master]
    types: [opened, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    # Dependabot が作成した PR のみを対象にする
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
      # gh pr checks は check runs（checks）と commit statuses（statuses）の両方を参照する。
      # ジョブで permissions を指定すると未指定の権限は none になるため明示する
      checks: read
      statuses: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # ランナーに pnpm が無いため、Claude が pnpm install / pnpm audit を
      # 実行できるようツールだけを用意する。依存のインストールはここでは行わない
      # （公開直後の版が minimumReleaseAge で弾かれるとジョブ自体が落ちるため）。
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Dependabot はコミットメッセージ末尾に updated-dependencies ブロックを埋め込む。
      # ここから update-type を取り出す（グループ更新では複数エントリになる）。
      - name: Resolve Dependabot update type
        id: metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          messages="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/commits" --paginate --jq '.[].commit.message')"
          types="$(printf '%s\n' "$messages" \
            | grep -oE 'update-type: version-update:semver-(patch|minor|major)' \
            | sed 's/.*semver-//' | sort -u || true)"

          if [ -z "$types" ]; then
            resolved="unknown"
          elif printf '%s\n' "$types" | grep -qx 'major'; then
            resolved="major"
          elif printf '%s\n' "$types" | grep -qx 'minor'; then
            resolved="minor"
          else
            resolved="patch"
          fi

          echo "検出された update-type: ${types:-(なし)} → 集約結果: ${resolved}"
          echo "update-type=${resolved}" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code review
        id: claude
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # agent モードでは checkHumanActor が github.actor を検査し、allowed_bots 既定値 "" だと
          # Dependabot 起因の run が「Workflow initiated by non-human actor」で失敗するため許可する。
          allowed_bots: "dependabot[bot]"
          additional_permissions: |
            actions: read
          # --setting-sources user: PR head の .claude/settings.json（フック等）を読み込ませず、
          # PR head のコードを実行させないため
          claude_args: >-
            --setting-sources user
            --allowed-tools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh api:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh release view:*),Bash(pnpm install --frozen-lockfile --ignore-scripts),Bash(pnpm audit),Bash(cat:*),Bash(grep:*),Write(//tmp/dependabot-review.md),Edit(//tmp/dependabot-review.md),WebSearch,WebFetch"
          prompt: |
            あなたはこのリポジトリの依存関係更新レビュー担当です。
            対象PR: ${{ github.repository }}#${{ github.event.pull_request.number }}
            タイトル: ${{ github.event.pull_request.title }}
            Dependabot が報告した更新種別: ${{ steps.metadata.outputs.update-type }}

            以下を必ず実行すること。

            1. `.github/DEPENDABOT_REVIEW_TEMPLATE.md` を読み、確認する観点と出力形式を把握する。
            2. `CLAUDE.md` を読み、依存関係に関する注意事項を確認する。
            3. `gh pr diff` で `package.json` / `pnpm-lock.yaml` の差分を確認し、影響範囲を特定する。
            4. CI の結果を確認し、観点表の CI 行と判定に反映する。
               確認には `gh pr checks ${{ github.event.pull_request.number }}` を使う。
               ビルドやテストはこのジョブでは実行せず、CI の結果を根拠とする（PR head のコードを実行させないため）。
            5. 更新対象ライブラリのリリースノート / CHANGELOG を WebFetch / WebSearch で確認し、
               破壊的変更・非推奨化・挙動変更の有無を調べる。
            6. **上流リポジトリの直近のIssue・不具合報告を調査する**。
               `gh search issues` や WebSearch を使い、当該バージョンに対する不具合報告、
               リリース直後の revert / 追従リリースの有無を確認する。
               確認したクエリと結果（該当なしを含む）は調査ログに記載する。
            7. セキュリティ観点を確認する。CVE/GHSA 修正の有無、pnpm-lock.yaml で新規に入る推移依存、
               postinstall スクリプトの追加などサプライチェーン上のリスク。
               可能なら `pnpm install --frozen-lockfile --ignore-scripts` の後
               `pnpm audit` を実行する。
            8. 調査結果を `.github/DEPENDABOT_REVIEW_TEMPLATE.md` の形式どおりにまとめ、
               レビュー本文を Write で `/tmp/dependabot-review.md` に書き出す。
               書き出した本文を記述ルールと照合し、違反があれば Edit で直してから、
               `gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/dependabot-review.md` でPRに投稿する。

            マージ可否を判断するのは人間であり、あなたはその判断材料を提供する。
            読み手がコメント冒頭の数行で判断できるよう、判定を先頭に書き、調査の過程は調査ログに留める。
            事実で書くこと。確認できなかったことを「問題なし」と書かない。
            推測で埋めず、未確認は「未確認（理由）」と明記する。
